name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Basic HTML sanity check
        run: |
          # Fail if index.html is missing or empty.
          test -s index.html || { echo "index.html missing or empty"; exit 1; }
          # Fail on UTC-drift antipattern, but ignore lines that are JS comments
          # (comments documenting the antipattern shouldn't fail the build).
          if grep -nE 'toISOString\(\)\.slice\(0,\s*10\)' index.html | grep -vE '^\s*[0-9]+:\s*//'; then
            echo "::error::UTC-drift antipattern present — use todayLocalIso()"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
