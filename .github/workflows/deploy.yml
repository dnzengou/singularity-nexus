name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Basic HTML sanity check
        run: |
          # Both shipped pages must exist and be non-empty.
          test -s index.html || { echo "index.html (landing) missing or empty"; exit 1; }
          test -s app.html   || { echo "app.html (dashboard) missing or empty"; exit 1; }
          # Fail on UTC-drift antipattern across every shipped HTML file, but ignore
          # JS single-line comments (comments documenting the antipattern shouldn't fail).
          if grep -rnE 'toISOString\(\)\.slice\(0,\s*10\)' *.html | grep -vE ':\s*[0-9]+:\s*//'; then
            echo "::error::UTC-drift antipattern present — use todayLocalIso()"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
